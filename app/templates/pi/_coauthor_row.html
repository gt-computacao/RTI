{% set c = c|default({"name": "", "email": "", "percentage": "", "institution_key": "ifms"}) %}
<div class="coauthor-row" data-coauthor-row data-institution-key="{{ c.institution_key }}">
  <div class="form-grid-3">
    <div class="form-row">
      <label>Nome *</label>
      <input type="text" name="coauthor_name" value="{{ c.name }}" required autocomplete="off" />
    </div>
    <div class="form-row">
      <label>Email *</label>
      <input type="email" name="coauthor_email" value="{{ c.email }}" required autocomplete="email" />
    </div>
    <div class="form-row">
      <label>% participação global *</label>
      <input type="number" name="coauthor_percentage" value="{{ c.percentage }}" min="0.01" max="100" step="0.01" required inputmode="decimal" />
    </div>
  </div>
  <input type="hidden" name="coauthor_institution_key" value="{{ c.institution_key }}" />
  <button type="button" class="btn btn-danger btn-sm"
          onclick="this.closest('.coauthor-row').remove(); document.dispatchEvent(new Event('input')); syncParticipationUI();">
    Remover coautor
  </button>
</div>
